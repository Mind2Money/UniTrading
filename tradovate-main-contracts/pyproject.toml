[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tradovate-main-contracts"
version = "1.0.1"
description = "Resolve Tradovate futures volume leaders for every visible product"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["websocket-client>=1.9,<2"]

[project.scripts]
tradovate-main-contracts = "main_contracts.__main__:main"

[tool.setuptools.packages.find]
include = ["main_contracts*"]
