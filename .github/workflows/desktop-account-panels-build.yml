name: Desktop account and trading panels
on:
  push:
    branches: ['build/desktop-finesse-20261119']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Package Windows app
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-DesktopAccountPanels-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-DesktopAccountPanels-Windows-x64
          path: dist/UniTrading-DesktopAccountPanels-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install CJK fonts when available
        run: |
          if ! (timeout 90s sudo apt-get update && timeout 90s sudo apt-get install -y fonts-noto-cjk); then
            echo "::warning::CJK font installation timed out; continuing functional tests with runner fonts."
          fi
      - name: Test desktop account panels, safety and mobile regressions
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*DesktopWorkspaceTabsUiTest*' --tests '*ChartContextMenuUiTest*' --tests '*DesktopAccountPanelsUiTest*' --tests '*UnifiedToolbarUiTest*' --tests '*ChartDrawingsTest*' --tests '*DesktopPanelGeometryTest*' --tests '*TradeListUiTest*' --tests '*AccountRiskUiTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UniTrading-DesktopAccountPanels-Test-Results
          path: |
            artifacts/desktop-account-panels/*.png
            artifacts/desktop-tabs/*.png
            artifacts/multichart/*.png
            artifacts/orderflow/*.png
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
