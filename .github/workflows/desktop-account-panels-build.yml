name: Desktop account toolbar and Android build
on:
  push:
    branches: ['build/chart-menu-review-20261119', 'build/top-account-toolbar-20261119']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Android (retry dependency resolution once)
        run: |
          ./gradlew :androidApp:assembleStandardDebug --no-daemon || \
            ./gradlew :androidApp:assembleStandardDebug --no-daemon --refresh-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-AccountToolbar-Android-debug
          path: androidApp/build/outputs/apk/standard/debug/androidApp-standard-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Package Windows app
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-AccountToolbar-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-AccountToolbar-Windows-x64
          path: dist/UniTrading-AccountToolbar-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install CJK fonts when available
        run: |
          if ! fc-list :lang=zh file | grep -q .; then
            mkdir -p ~/.local/share/fonts
            if timeout 120s curl -fsSL --retry 2 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
              -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf; then
              fc-cache -f ~/.local/share/fonts
            else
              echo "::warning::CJK font unavailable; continuing functional tests with runner fonts."
            fi
          fi
      - name: Test account toolbar, order safety and mobile regressions
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*DesktopWorkspaceTabsUiTest*' --tests '*TabletWorkspaceTabsUiTest*' --tests '*WindowsTitleBarUiTest*' --tests '*ChartContextMenuUiTest*' --tests '*KeyboardTradingUiTest*' --tests '*AccountBracketsUiTest*' --tests '*OrderCapacityUiTest*' --tests '*ContinuousContractUiTest*' --tests '*DesktopAccountPanelsUiTest*' --tests '*AccountAliasUiTest*' --tests '*AccountOverviewUiTest*' --tests '*DesktopWindowsUiTest*' --tests '*MobileLayoutTest*' --tests '*UnifiedToolbarUiTest*' --tests '*ChartDrawingsTest*' --tests '*DesktopPanelGeometryTest*' --tests '*ChartPreferencesTest*' --tests '*WorkspaceTabDataTest*' --tests '*ChartUndoCoordinatorTest*' --tests '*IndicatorSettingsTest*' --tests '*AccountAnalyticsTest*' --tests '*AccountAnalyticsUiTest*' --tests '*ResponsiveCalendarUiTest*' --tests '*SettingsPageTest*' --tests '*PriceAxisUiTest*' --tests '*OrderFlowUiTest*' --tests '*TradeListUiTest*' --tests '*AccountRiskUiTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UniTrading-AccountToolbar-Test-Results
          path: |
            artifacts/desktop-order/*.png
            artifacts/unified-toolbar/*.png
            artifacts/desktop-account-panels/*.png
            artifacts/desktop-tabs/*.png
            artifacts/multichart/*.png
            artifacts/orderflow/*.png
            artifacts/*.png
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
