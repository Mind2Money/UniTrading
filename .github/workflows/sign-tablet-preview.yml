name: Sign tablet layout test APK
on:
  push:
    branches: ['fix/tablet-header-controls']
permissions:
  contents: read
  actions: read
jobs:
  signed-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download PR Android build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks" "$RUNNER_TEMP/signed"
          gh run download 44799454832 --repo "$GITHUB_REPOSITORY" --name UniTrading-apk-unsigned --dir "$RUNNER_TEMP/apks"
          apk="$(find "$RUNNER_TEMP/apks" -type f -name '*.apk' ! -name '*webview*' -print -quit)"
          test -s "$apk"
          echo "SOURCE_APK=$apk" >> "$GITHUB_ENV"
      - name: Sign and verify test APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_STORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/tablet-preview.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          "$build_tools/zipalign" -c 4 "$SOURCE_APK"
          args=(sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --v4-signing-enabled false)
          if [ -n "${KEY_PASSWORD:-}" ]; then args+=(--key-pass env:KEY_PASSWORD); fi
          out="$RUNNER_TEMP/signed/UniTrading-1.7.0-tablet-order-rail-PR10-test.apk"
          "$build_tools/apksigner" "${args[@]}" --out "$out" "$SOURCE_APK"
          "$build_tools/apksigner" verify --print-certs "$out" | grep -i 'certificate SHA-256'
          sha256sum "$out"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablet-header-signed-test-apk
          path: ${{ runner.temp }}/signed/*.apk
          if-no-files-found: error
