name: build

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

# Read-only: signing and the Telegram upload need secrets, not repository writes.
# Only the v* tag jobs write: release publishes, notify-discord records its send.
permissions:
  contents: read

concurrency:
  # Replace obsolete PR checks, but give every push its own group.
  # Release signing and notification must finish for every push.
  # Published runs still finish signing and notifying without being cancelled.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # The daemon buys nothing on a runner that is thrown away afterwards.
  GRADLE_OPTS: -Dorg.gradle.daemon=false

jobs:
  # Tests and iOS builds run locally via scripts/build-local.ps1. Hosted runners
  # produce and deliver the Android release; a v* tag also packages Windows and
  # macOS, publishes the GitHub Release and announces it on Discord.
  # ─── Android ────────────────────────────────────────────────────────────────
  # Every branch and pull request builds the R8-minified release APK; only
  # main/master and v* tag pushes go on to signing and Telegram.
  build-android:
    name: Android APK (R8)
    runs-on: ubuntu-latest
    timeout-minutes: 35
    outputs:
      apk_name: ${{ steps.apk.outputs.name }}
      version_name: ${{ steps.apk.outputs.version_name }}
      version_code: ${{ steps.apk.outputs.version_code }}
      short_sha: ${{ steps.meta.outputs.short_sha }}
      commit_msg: ${{ steps.meta.outputs.commit_msg }}
      commit_count: ${{ steps.meta.outputs.commit_count }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      # composeApp and the broker modules use a Java 21 toolchain.
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      # The legacy "tools" package the action installs by default no longer
      # exists in the SDK repository; platform-tools is all this build needs.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      # compileSdk 37 is published as android-37.0; the bare name does not exist.
      # androidApp compiles against 37.2, the oldest GeckoView accepts.
      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: 解析提交信息
        id: meta
        run: |
          git fetch --force --tags >/dev/null 2>&1 || true
          # Start from HEAD^: on a tag run HEAD itself carries the tag being released.
          latest_tag="$(git describe --tags --abbrev=0 --match 'v*' HEAD^ 2>/dev/null || true)"
          if [ -z "$latest_tag" ]; then
            count="$(git rev-list --count HEAD)"
          else
            count="$(git rev-list --count "${latest_tag}..HEAD")"
          fi
          {
            echo "short_sha=$(git rev-parse --short HEAD)"
            echo "commit_msg=$(git log -1 --pretty=%s)"
            echo "commit_count=$count"
          } >> "$GITHUB_OUTPUT"

      # The release build type shrinks code and resources with R8, and the task
      # builds both flavors: standard and gecko (androidApp/build.gradle.kts).
      - name: 编译 release APK
        run: ./gradlew :androidApp:assembleRelease

      - name: 检查并重命名 APK
        id: apk
        env:
          SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        run: |
          set -euo pipefail
          out=androidApp/build/outputs
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          mkdir -p dist
          # Each flavor, and what its file name adds after the commit.
          for variant in standard: gecko:-webview; do
            flavor="${variant%%:*}"
            suffix="${variant#*:}"
            # A fresh checkout has no stale outputs, so these files prove that this
            # build ran R8 and resource shrinking.
            test -s "$out/mapping/${flavor}Release/mapping.txt"
            test -s "$out/mapping/${flavor}Release/resources.txt"
            apk="$out/apk/$flavor/release/androidApp-$flavor-release-unsigned.apk"
            test -f "$apk"

            badging="$("$build_tools/aapt2" dump badging "$apk")"
            version_name="$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionName='\([^']*\)'.*/\1/p")"
            version_code="$(printf '%s\n' "$badging" | sed -n "s/^package:.* versionCode='\([^']*\)'.*/\1/p")"
            test -n "$version_name"
            test -n "$version_code"

            # A release takes its version from the tag, which must match the build.
            if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version_name" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match versionName $version_name"
              exit 1
            fi

            name="UniTrading-${version_name}-${SHORT_SHA}"
            cp "$apk" "dist/${name}${suffix}-unsigned.apk"
          done

          # The login window installs these while running, so nothing earlier
          # notices them missing; a phone cannot install the wrong architecture.
          contents="$(unzip -l "dist/${name}-webview-unsigned.apk")"
          for environment in demo live; do
            if ! grep -q "assets/tradovate-login/$environment/login.js" <<<"$contents"; then
              echo "::error::The $environment login extension is not packaged"
              exit 1
            fi
          done
          if ! grep -q "native-code: 'arm64-v8a'" <<<"$("$build_tools/aapt2" dump badging "dist/${name}-webview-unsigned.apk")"; then
            echo "::error::The -webview APK is not arm64-v8a"
            exit 1
          fi
          ls -l dist
          {
            echo "name=$name"
            echo "version_name=$version_name"
            echo "version_code=$version_code"
          } >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-apk-unsigned
          path: dist/*-unsigned.apk
          if-no-files-found: error

      # R8 renames the app's symbols; a stack trace from this APK needs this map.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-mapping-android
          path: androidApp/build/outputs/mapping/standardRelease/mapping.txt
          retention-days: 90
          if-no-files-found: error

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-mapping-android-webview
          path: androidApp/build/outputs/mapping/geckoRelease/mapping.txt
          retention-days: 90
          if-no-files-found: error

  # Uses the same four signing secrets as DAView and RedefineNCM_KMP. The SDK's
  # own apksigner is called directly: the passwords reach it through the
  # environment and the keystore file is deleted before the step ends.
  sign-android:
    name: 签名 Android Release
    # Local regression tests must pass before pushing; no hosted test jobs.
    needs: [build-android]
    if: >-
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      APK_NAME: ${{ needs.build-android.outputs.apk_name }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-apk-unsigned
          path: unsigned

      - name: 签名 APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$SIGNING_KEY_BASE64" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_STORE_PASSWORD" ]; then
            echo "::error::缺少签名 secret：SIGNING_KEY_BASE64、ALIAS、KEY_STORE_PASSWORD（KEY_PASSWORD 可选）"
            exit 1
          fi
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          echo "using $build_tools"

          keystore="$RUNNER_TEMP/release.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$keystore"

          mkdir -p signed
          # No v4 signature: it is a separate .idsig file nothing here ships.
          args=(sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --v4-signing-enabled false)
          # A PKCS12 store has one password for both; pass a key password only
          # when one is configured.
          if [ -n "${KEY_PASSWORD:-}" ]; then
            args+=(--key-pass env:KEY_PASSWORD)
          fi
          for apk in "$APK_NAME" "$APK_NAME-webview"; do
            unsigned="unsigned/$apk-unsigned.apk"
            test -f "$unsigned"
            "$build_tools/zipalign" -c 4 "$unsigned"
            "$build_tools/apksigner" "${args[@]}" --out "signed/$apk.apk" "$unsigned"
            "$build_tools/apksigner" verify --print-certs "signed/$apk.apk" | grep -i 'SHA-256'
          done

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-apk-signed
          path: signed/${{ needs.build-android.outputs.apk_name }}.apk
          if-no-files-found: error

      # Kept apart because Telegram takes only the standard APK; this one is over
      # the 50 MB a bot can send.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-apk-webview-signed
          path: signed/${{ needs.build-android.outputs.apk_name }}-webview.apk
          if-no-files-found: error

  # ─── Windows 桌面包（仅 v* tag）──────────────────────────────────────────────
  build-windows:
    name: Windows 桌面包
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle configures the Android targets even for a desktop task.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: 打包桌面应用
        run: ./gradlew.bat :composeApp:createDistributable

      # The packaged app finds the login host only under app/resources; the
      # repo-relative fallbacks serve `run`, so nothing earlier notices it missing.
      - name: 检查并压缩
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          $packaged = (Get-Item "$app/UniTrading.exe").VersionInfo.ProductVersion
          if ($packaged -ne $version) { throw "UniTrading.exe is $packaged, tag is $env:GITHUB_REF_NAME" }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host is not packaged' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath "dist/UniTrading-$version-windows-x64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-windows-x64
          path: dist/*-windows-x64.zip
          compression-level: 0
          if-no-files-found: error

  # ─── macOS 桌面包（仅 v* tag）────────────────────────────────────────────────
  # Apple Silicon, ad-hoc signed and not notarized. The only tests here are the
  # ones that exercise macOS code, which the Windows regression cannot run.
  build-macos:
    name: macOS 桌面包
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4
        with:
          distribution: temurin
          java-version: "21"

      # Gradle configures the Android targets even for a desktop task.
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: 安装 compile SDK
        run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"

      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d # v4

      - name: 测试 macOS 专属代码
        run: ./gradlew :composeApp:desktopTest --tests 'com.unitrading.DesktopCredentialStoreTest' --tests 'com.unitrading.KeychainSealTest' --tests 'com.unitrading.DesktopLoginHandoffTest'

      - name: 打包桌面应用
        run: ./gradlew :composeApp:createDistributable

      # The packaged app finds the login host only under app/resources, and
      # Gatekeeper rejects a bundle whose nested signatures disagree.
      - name: 检查并压缩
        run: |
          set -euo pipefail
          app=composeApp/build/compose/binaries/main/app/UniTrading.app
          version="$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Contents/Info.plist")"
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::$app is $version, tag is $GITHUB_REF_NAME"
            exit 1
          fi
          host="$app/Contents/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin"
          if [ ! -x "$host" ]; then
            echo "::error::Login host is missing or not executable: $host"
            ls -l "$(dirname "$host")" || true
            exit 1
          fi
          self_test="$("$host" --self-test)" || { echo "::error::Packaged login host failed its self-test: $self_test"; exit 1; }
          echo "$self_test"
          codesign --force --deep --sign - "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          mkdir -p dist
          ditto -c -k --keepParent "$app" "dist/UniTrading-$version-macos-arm64.zip"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: UniTrading-macos-arm64
          path: dist/*-macos-arm64.zip
          compression-level: 0
          if-no-files-found: error

  # ─── GitHub Release（仅 v* tag）──────────────────────────────────────────────
  # Runs once every package exists. The notes come from docs/release-notes.md and
  # the tag's commits; the R8 map stays on this private repository's release.
  release:
    name: GitHub Release
    needs: [build-android, sign-android, build-windows, build-macos]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-apk-signed
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-apk-webview-signed
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-windows-x64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-macos-arm64
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-mapping-android
          path: dist

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: UniTrading-mapping-android-webview
          path: dist/webview-mapping

      # Re-running must not fail on an existing release; uploads replace assets.
      - name: 创建或更新 Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          APK_NAME: ${{ needs.build-android.outputs.apk_name }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
        run: |
          set -euo pipefail
          python3 scripts/release-notes.py "$TAG" --commits > release-notes.md
          mapping="dist/UniTrading-${VERSION_NAME}-android-mapping.txt"
          mv dist/mapping.txt "$mapping"
          webview_mapping="dist/UniTrading-${VERSION_NAME}-android-webview-mapping.txt"
          mv dist/webview-mapping/mapping.txt "$webview_mapping"
          if gh release view "$TAG" --json tagName >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes-file release-notes.md
          else
            gh release create "$TAG" --verify-tag --title "$TAG" --notes-file release-notes.md
          fi
          gh release upload "$TAG" --clobber \
            "dist/${APK_NAME}.apk" "dist/${APK_NAME}-webview.apk" "dist/UniTrading-${VERSION_NAME}-windows-x64.zip" \
            "dist/UniTrading-${VERSION_NAME}-macos-arm64.zip" "$mapping" "$webview_mapping"

  # ─── Discord（仅 v* tag）─────────────────────────────────────────────────────
  # Runs after the release, so the link in the message already downloads. A failure
  # here leaves the release published; re-running this job sends the message.
  notify-discord:
    name: Discord 公告
    needs: [release]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      statuses: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: 发送公告
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_RELEASE_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: python3 scripts/release-discord.py "$GITHUB_REF_NAME"

  # ─── Telegram（main/master 与 v* tag 的 push）────────────────────────────────
  notify-telegram:
    name: Telegram 通知
    needs: [build-android, sign-android]
    if: >-
      !cancelled() && github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' ||
       github.ref == 'refs/heads/master' ||
       startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A pattern, unlike a name, downloads nothing instead of failing when
      # signing did not run, so the failure still reaches Telegram.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: UniTrading-apk-signed
          path: dist
          merge-multiple: true

      - name: 推送到 Telegram
        timeout-minutes: 5
        # Everything from the commit or the ref reaches the script through the
        # environment; written into the script with ${{ }}, a commit subject
        # holding a quote or $( ) would run in the shell next to the bot token.
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MSG: ${{ needs.build-android.outputs.commit_msg }}
          SHORT_SHA: ${{ needs.build-android.outputs.short_sha }}
          COMMIT_COUNT: ${{ needs.build-android.outputs.commit_count }}
          VERSION_NAME: ${{ needs.build-android.outputs.version_name }}
          VERSION_CODE: ${{ needs.build-android.outputs.version_code }}
          REF: ${{ github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Telegram secrets not set — skipping."
            exit 0
          fi

          # Only the signed APK is sent; an unsigned one cannot be installed.
          APK=$(find dist -name 'UniTrading-*.apk' ! -name '*unsigned*' -print -quit 2>/dev/null || true)

          # ✅ when the file exists, ❌ otherwise.
          status() { [ -n "$1" ] && [ -f "$1" ] && printf '✅' || printf '❌'; }
          escape() { printf '%s' "$1" | sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }

          CAPTION=$(printf '<b>UniTrading</b>  ·  <code>%s</code>\n\n📝 %s\n🔖 <code>%s (%s)</code>  ·  <code>%s</code>  ·  +%s commits\n\n──────────────────\n🤖 Android  %s  APK (signed, R8-minified)\n\n<a href="%s">CI run</a>' \
            "$(escape "$REF")" "$(escape "${COMMIT_MSG:-?}")" "${VERSION_NAME:-?}" "${VERSION_CODE:-?}" \
            "${SHORT_SHA:-?}" "${COMMIT_COUNT:-?}" "$(status "$APK")" "$RUN_URL")

          API="https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}"

          if [ -n "$APK" ] && [ -f "$APK" ]; then
            CAPTION_FILE=$(mktemp)
            trap 'rm -f "$CAPTION_FILE"' EXIT
            printf '%s' "$CAPTION" > "$CAPTION_FILE"
            curl -sS --fail-with-body --connect-timeout 15 --max-time 180 -X POST "${API}/sendDocument" \
              -F chat_id="${TELEGRAM_CHAT_ID}" \
              -F "document=@${APK}" \
              -F "caption=<${CAPTION_FILE}" \
              -F parse_mode=HTML
          else
            curl -sS --fail-with-body --connect-timeout 15 --max-time 60 -X POST "${API}/sendMessage" \
              -H 'Content-Type: application/json' \
              --data "$(jq -n --arg c "$TELEGRAM_CHAT_ID" --arg t "$CAPTION" \
                '{"chat_id":$c,"text":$t,"parse_mode":"HTML"}')"
          fi
