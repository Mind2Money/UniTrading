name: Android released APK startup check
on:
  push:
    branches: [fix/android-release-startup-20261120]
permissions:
  contents: read
jobs:
  startup:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - name: Download published APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release download v1.7.0 --repo Mind2Money/UniTrading --pattern 'UniTrading-1.7.0-f010f94.apk' --output app.apk
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch exact released standard APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb install app.apk
            adb logcat -c
            adb shell am start -W -n com.unitrading.demo/com.unitrading.android.MainActivity || true
            sleep 25
            adb logcat -b crash -d
            adb shell pidof com.unitrading.demo
