name: Android release startup check
on:
  push:
    branches: [fix/android-release-startup-20261120]
permissions:
  contents: read
  actions: read
jobs:
  sign-candidate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Download unsigned build for this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          run_id=''
          status=''
          for i in $(seq 1 60); do
            run_id=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow build.yml --branch "$GITHUB_REF_NAME" --limit 30 --json databaseId,headSha --jq '.[] | [.headSha, (.databaseId|tostring)] | @tsv' | awk -v sha="$GITHUB_SHA" '$1 == sha { print $2; exit }')
            if [ -n "$run_id" ]; then
              status=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json status --jq .status)
              if [ "$status" = completed ]; then
                conclusion=$(gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --json conclusion --jq .conclusion)
                test "$conclusion" = success || { echo "Build failed: $conclusion"; exit 1; }
                break
              fi
            fi
            sleep 15
          done
          test "$status" = completed
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name UniTrading-apk-unsigned --dir unsigned
      - name: Sign candidate APKs
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_STORE_PASSWORD"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          keystore="$RUNNER_TEMP/release.keystore"
          umask 077
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          mkdir -p signed
          args=(sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --v4-signing-enabled false)
          if [ -n "${KEY_PASSWORD:-}" ]; then args+=(--key-pass env:KEY_PASSWORD); fi
          shopt -s nullglob
          files=(unsigned/*-unsigned.apk)
          test "${#files[@]}" = 2
          for apk in "${files[@]}"; do
            base="${apk##*/}"
            base="${base%-unsigned.apk}"
            "$build_tools/zipalign" -c 4 "$apk"
            "$build_tools/apksigner" "${args[@]}" --out "signed/$base.apk" "$apk"
            "$build_tools/apksigner" verify "signed/$base.apk"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-android-startup-candidates
          path: signed/*.apk
          if-no-files-found: error
  startup:
    needs: sign-candidate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        api: [29, 35]
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: UniTrading-android-startup-candidates
          path: signed
      - name: Select standard APK
        run: |
          set -euo pipefail
          apk=$(find signed -type f -name '*.apk' ! -name '*-webview.apk' -print -quit)
          test -n "$apk"
          cp "$apk" app.apk
      - name: Enable virtualization
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch signed release APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb install app.apk
            adb logcat -c
            adb shell am start -W -n com.unitrading.demo/com.unitrading.android.MainActivity || true
            sleep 25
            adb logcat -b crash -d
            adb shell pidof com.unitrading.demo
            adb shell dumpsys activity activities | grep com.unitrading.demo
