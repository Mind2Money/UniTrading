name: Windows test build
on:
  push:
    branches: [feature/chart-colors-sessions]
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Run focused tests
        run: ./gradlew.bat :composeApp:desktopTest --tests "*ChartSessionTest*" --tests "*CrosshairTest*" --tests "*ThemePaletteTest*" --tests "*MaterialThemeTest*" --tests "*ThemeSettingsTest*" --tests "*ChartPreferencesTest*" :tradovate-broker:desktopTest --tests "*CandleCacheTest*" --no-daemon
      - name: Build Windows application
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Archive application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          Compress-Archive -Path $app -DestinationPath UniTrading-windows-test.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-windows-test
          path: UniTrading-windows-test.zip
          retention-days: 14
          if-no-files-found: error
  chart-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify independent chart session controls
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*DesktopWorkspaceTabsUiTest.sessionChoiceFollowsEachSplitChart' --tests '*SettingsPageTest.timeZoneMovesToTradingSettingsAndSupportsUtcExtremes' --no-daemon
