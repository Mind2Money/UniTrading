name: Replay object layers Windows preview
on:
  push:
    branches: ['build/replay-object-layers-20261125']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo apt-get update && sudo apt-get install -y xvfb
      - name: Test replay and chart object workflows
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*ChartObjectLayersTest*' --tests '*ChartObjectRenderingUiTest*' --tests '*ChartDrawingsTest*' --tests '*ChartContextMenuUiTest*' --tests '*HistoricalReplayUiTest*' --tests '*ReplaySetupUiTest*' --tests '*ReplayDashboardUiTest*' --tests '*ReplayDailyLossUiTest*' --tests '*ReplayRecordsTest*' --tests '*ReplayRiskTest*' --tests '*HistoricalReplayTest*' --tests '*ReplayAnalysisTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: replay-object-layers-test-results
          path: composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: ignore
  windows:
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Compile tests and package Windows app
        run: ./gradlew.bat :composeApp:compileTestKotlinDesktop :composeApp:createDistributable --no-daemon
      - name: Check and compress
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-Replay-Object-Layers-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: replay-object-layers-windows-x64
          path: dist/UniTrading-Replay-Object-Layers-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
