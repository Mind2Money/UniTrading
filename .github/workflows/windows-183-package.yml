name: Windows 1.8.3 package
on:
  push:
    branches: ['verify/hyperprop-personal-1795722200']
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install "platforms;android-37.0" "platforms;android-37.2"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Test Hyperprop parsing
        run: ./gradlew.bat :composeApp:desktopTest --tests "com.unitrading.app.Hyperprop*Test" --no-daemon
      - name: Build Windows application
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and package
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          $exe = "$app/UniTrading.exe"
          if (-not (Test-Path $exe)) { throw 'Windows executable is missing' }
          $version = (Get-Item $exe).VersionInfo.ProductVersion
          if ($version -ne '1.8.3') { throw "Unexpected executable version $version" }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Tradovate login host is missing' }
          if (-not (Test-Path "$app/runtime/bin/java.dll")) { throw 'Bundled runtime is missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath "dist/UniTrading-1.8.3-windows-x64.zip"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-1.8.3-windows-x64
          path: dist/UniTrading-1.8.3-windows-x64.zip
          compression-level: 0
          if-no-files-found: error
