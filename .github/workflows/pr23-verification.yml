name: PR23 replay and tablet verification
on:
  push:
    branches: [feature/desktop-tablet-replay-ticks]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests com.unitrading.chart.ReplayStepTest --tests com.unitrading.ui.HistoricalReplayUiTest --tests com.unitrading.ui.TabletReplayUiTest --tests com.unitrading.ui.TabletChartFullscreenUiTest --tests com.unitrading.chart.drawing.PositionDrawingOrderTest --tests com.unitrading.chart.drawing.ChartDrawingsTest --tests com.unitrading.ui.ChartContextMenuUiTest --tests com.unitrading.ui.AccountRiskTest --no-daemon
      - name: Print test failures
        if: failure()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          for path in glob.glob('composeApp/build/test-results/desktopTest/*.xml'):
              root = ET.parse(path).getroot()
              for case in root.findall('testcase'):
                  for failure in case.findall('failure'):
                      print(f"{case.get('classname')}.{case.get('name')}: {failure.get('message')}\n{failure.text}")
          PY
