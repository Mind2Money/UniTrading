name: Android release after activation
on:
  push:
    branches: [fix/android-after-activation]
permissions:
  contents: read
  actions: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - name: Prepare standalone emulator probe
        run: |
          mkdir -p "$RUNNER_TEMP/probe-src" "$RUNNER_TEMP/probe-classes" "$RUNNER_TEMP/probe-out"
          cat > "$RUNNER_TEMP/probe-src/SyntheticReleaseProbe.java" <<'JAVA'
          package com.unitrading.android;
          
          import android.app.Activity;
          import android.app.Instrumentation;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;
          import android.security.keystore.KeyGenParameterSpec;
          import android.security.keystore.KeyProperties;
          import android.view.accessibility.AccessibilityNodeInfo;
          import java.io.File;
          import java.io.FileOutputStream;
          import java.security.KeyStore;
          import javax.crypto.Cipher;
          import javax.crypto.KeyGenerator;
          import javax.crypto.SecretKey;
          
          /** Emulator-only probe: writes a synthetic activation record without exposing a real license key. */
          public final class SyntheticReleaseProbe extends Instrumentation {
              @Override public void onCreate(Bundle arguments) { super.onCreate(arguments); start(); }
              @Override public void onStart() {
                  Bundle result = new Bundle();
                  try {
                      Context target = getTargetContext();
                      String alias = "unitrading.license.v1";
                      KeyStore store = KeyStore.getInstance("AndroidKeyStore");
                      store.load(null);
                      SecretKey key = (SecretKey) store.getKey(alias, null);
                      if (key == null) {
                          KeyGenerator generator = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                          generator.init(new KeyGenParameterSpec.Builder(alias, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setKeySize(256).build());
                          key = generator.generateKey();
                      }
                      Cipher cipher = Cipher.getInstance("AES/GCM/NoPadding");
                      cipher.init(Cipher.ENCRYPT_MODE, key);
                      byte[] plain = "{\"activation\":{\"keyId\":\"key-2026-11\",\"activatedAtMs\":0}}".getBytes("UTF-8");
                      byte[] encrypted = cipher.doFinal(plain);
                      try (FileOutputStream out = new FileOutputStream(new File(target.getNoBackupFilesDir(), "license-v1.enc"))) {
                          out.write(1); out.write(cipher.getIV()); out.write(encrypted);
                      }
                      Intent intent = target.getPackageManager().getLaunchIntentForPackage(target.getPackageName());
                      if (intent == null) throw new IllegalStateException("Launcher not found");
                      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                      Activity activity = startActivitySync(intent);
                      boolean loginVisible = false;
                      for (int i = 0; i < 30; i++) {
                          Thread.sleep(1000);
                          AccessibilityNodeInfo root = getUiAutomation().getRootInActiveWindow();
                          if (root != null && !root.findAccessibilityNodeInfosByText("登录交易账户").isEmpty()) { loginVisible = true; break; }
                      }
                      if (!loginVisible || activity.isFinishing()) throw new AssertionError("Login page did not appear after activation");
                      Thread.sleep(3000);
                      result.putString("stream", "\nPROBE_SUCCESS: activated app shows login page\n");
                      finish(Activity.RESULT_OK, result);
                  } catch (Throwable error) {
                      android.util.Log.e("SyntheticReleaseProbe", "Activation probe failed", error);
                      result.putString("stream", "\nPROBE_FAILURE: " + error + "\n");
                      finish(Activity.RESULT_CANCELED, result);
                  }
              }
          }
          JAVA
          cat > "$RUNNER_TEMP/probe-src/AndroidManifest.xml" <<'MANIFEST'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android" package="com.unitrading.probe">
              <uses-sdk android:minSdkVersion="26" android:targetSdkVersion="28" />
              <application android:label="Synthetic release probe" />
              <instrumentation android:name="com.unitrading.android.SyntheticReleaseProbe" android:targetPackage="com.unitrading.demo" android:label="Synthetic release probe" />
          </manifest>
          MANIFEST
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          android_jar="$(find "$ANDROID_HOME/platforms" -name android.jar | sort -V | tail -n1)"
          test -f "$android_jar"
          javac -source 8 -target 8 -bootclasspath "$android_jar" -d "$RUNNER_TEMP/probe-classes" "$RUNNER_TEMP/probe-src/SyntheticReleaseProbe.java"
          "$build_tools/d8" --lib "$android_jar" --output "$RUNNER_TEMP/probe-out" "$RUNNER_TEMP/probe-classes/com/unitrading/android/SyntheticReleaseProbe.class"
          "$build_tools/aapt" package -f -M "$RUNNER_TEMP/probe-src/AndroidManifest.xml" -I "$android_jar" -F "$RUNNER_TEMP/probe-out/unsigned.apk"
          (cd "$RUNNER_TEMP/probe-out" && zip -q unsigned.apk classes.dex)
          "$build_tools/zipalign" -f 4 "$RUNNER_TEMP/probe-out/unsigned.apk" "$RUNNER_TEMP/probe-out/aligned.apk"
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build unminified candidate from the published source
        run: |
          git checkout 0c0f97caa5ee4aa0fd7a95c532a68df5fa885f3b -- composeApp/src/commonMain/kotlin/com/unitrading/ui/TradingScreen.kt
          sed -i 's/isMinifyEnabled = true/isMinifyEnabled = false/; s/isShrinkResources = true/isShrinkResources = false/' androidApp/build.gradle.kts
          ./gradlew :androidApp:assembleStandardRelease --no-daemon
      - name: Sign probe for installed production APK
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
          KEY_ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$SIGNING_KEY_BASE64" && test -n "$KEY_ALIAS" && test -n "$KEY_STORE_PASSWORD"
          umask 077
          keystore="$RUNNER_TEMP/probe.keystore"
          trap 'rm -f "$keystore"' EXIT
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode --ignore-garbage > "$keystore"
          build_tools="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)"
          apk="$RUNNER_TEMP/probe-out/aligned.apk"
          test -f "$apk"
          args=(sign --ks "$keystore" --ks-key-alias "$KEY_ALIAS" --ks-pass env:KEY_STORE_PASSWORD --v4-signing-enabled false)
          if [ -n "${KEY_PASSWORD:-}" ]; then args+=(--key-pass env:KEY_PASSWORD); fi
          "$build_tools/apksigner" "${args[@]}" --out "$RUNNER_TEMP/probe.apk" "$apk"
          "$build_tools/apksigner" verify "$RUNNER_TEMP/probe.apk"
          mkdir -p "$RUNNER_TEMP/new"
          "$build_tools/apksigner" "${args[@]}" --out "$RUNNER_TEMP/new/UniTrading-1.7.0-after-activation-fix.apk" androidApp/build/outputs/apk/standard/release/androidApp-standard-release-unsigned.apk
          "$build_tools/apksigner" verify "$RUNNER_TEMP/new/UniTrading-1.7.0-after-activation-fix.apk"
      - name: Download the known-good and current signed packages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44743533320 --repo "$GITHUB_REPOSITORY" --name UniTrading-android-startup-candidates --dir "$RUNNER_TEMP/old"
          gh run download 44752301842 --repo "$GITHUB_REPOSITORY" --name UniTrading-apk-signed --dir "$RUNNER_TEMP/published"
          find "$RUNNER_TEMP/old" "$RUNNER_TEMP/published" "$RUNNER_TEMP/new" -type f -name '*.apk' -print
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare isolated emulator script
        run: |
          cat > "$RUNNER_TEMP/after-activation-probe.sh" <<'PROBE'
          #!/usr/bin/env bash
          set -u
          mkdir -p artifacts/after-activation
          adb shell wm density 160
          adb shell wm size 1280x800
          for variant in old published new; do
            adb uninstall com.unitrading.probe >/dev/null 2>&1 || true
            adb uninstall com.unitrading.demo >/dev/null 2>&1 || true
            apk="$(find "$RUNNER_TEMP/$variant" -type f -name '*.apk' ! -iname '*webview*' | head -n 1)"
            test -n "$apk" || exit 1
            adb install "$apk" || exit 1
            adb install "$RUNNER_TEMP/probe.apk" || exit 1
            adb logcat -c
            adb shell am instrument -w com.unitrading.probe/com.unitrading.android.SyntheticReleaseProbe > "artifacts/after-activation/$variant-test.txt" 2>&1 || true
            adb logcat -d -b crash > "artifacts/after-activation/$variant-crash.txt" || true
            cat "artifacts/after-activation/$variant-test.txt"
            cat "artifacts/after-activation/$variant-crash.txt"
            adb shell am force-stop com.unitrading.demo
            adb logcat -c
            adb shell am start -n com.unitrading.demo/com.unitrading.android.MainActivity
            sleep 12
            adb shell pidof com.unitrading.demo > "artifacts/after-activation/$variant-pid.txt" || true
            adb shell dumpsys activity activities | grep -F 'com.unitrading.demo/com.unitrading.android.MainActivity' > "artifacts/after-activation/$variant-activity.txt" || true
            adb shell rm -f /sdcard/probe-window.xml
            timeout 25 adb shell uiautomator dump /sdcard/probe-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/probe-window.xml "artifacts/after-activation/$variant-ui.xml" >/dev/null 2>&1 || true
            adb shell screencap -p /sdcard/probe-screen.png
            adb pull /sdcard/probe-screen.png "artifacts/after-activation/$variant-screen.png" >/dev/null 2>&1 || true
            adb logcat -d -b crash > "artifacts/after-activation/$variant-restart-crash.txt" || true
            echo "Normal restart $variant PID: $(cat "artifacts/after-activation/$variant-pid.txt")"
            cat "artifacts/after-activation/$variant-restart-crash.txt"
          done
          test -s artifacts/after-activation/new-pid.txt
          if grep -F 'FATAL EXCEPTION' artifacts/after-activation/new-restart-crash.txt; then exit 1; fi
          PROBE
      - name: Compare exact release APKs after synthetic activation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: bash "$RUNNER_TEMP/after-activation-probe.sh"
      - name: Save signed candidate for verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: after-activation-candidate
          path: ${{ runner.temp }}/new/*.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: after-activation-results
          path: artifacts/after-activation/*
          if-no-files-found: warn
  desktop-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          fetch-depth: 0
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: git checkout 0c0f97caa5ee4aa0fd7a95c532a68df5fa885f3b -- composeApp/src/commonMain/kotlin/com/unitrading/ui/TradingScreen.kt composeApp/src/desktopTest/kotlin/com/unitrading/ui/TabletWorkspaceTabsUiTest.kt
      - run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*TabletWorkspaceTabsUiTest*' --tests '*DesktopAccountPanelsUiTest*' --tests '*AccountRiskUiTest*' --no-daemon
