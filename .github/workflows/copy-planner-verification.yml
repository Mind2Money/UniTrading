name: copy-planner-verification

on:
  push:
    branches: [feature/tradovate-copy-trading]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: ./gradlew :composeApp:desktopTest --tests com.unitrading.app.CopyTradePlannerTest --tests com.unitrading.app.CopyExecutionPlannerTest --tests com.unitrading.app.CopySourceOrdersTest --tests com.unitrading.app.CopySourceCaptureTest --tests com.unitrading.app.CopyDispatchJournalTest --tests com.unitrading.app.CopyOrderMutationPlannerTest --tests com.unitrading.app.CopyPendingOrderPlannerTest --tests com.unitrading.app.CopyPendingOrderJournalTest --tests com.unitrading.app.CopyPendingOrderSubmitterTest --tests com.unitrading.app.CopyTradeCommandGateTest --tests com.unitrading.app.CopyTradingControllerTest --no-daemon
      - run: ./gradlew :tradovate-broker:desktopTest --tests com.unitrading.tradovate.CopyTradingBrokerTest --no-daemon
