name: Tablet and desktop toolbar preview
on:
  push:
    branches: ['build/tablet-toolbar-preview-20261119']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build app
        run: ./gradlew :androidApp:assembleStandardDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: tablet-toolbar-android-debug
          path: androidApp/build/outputs/apk/standard/debug/androidApp-standard-debug.apk
          if-no-files-found: error
  previews:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Test and capture tablet, desktop and phone
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*UnifiedToolbarUiTest*' --tests '*ChartWindowsUiTest.splitChartsUseTheSelectedChartForOrdersAndKeepTheirOwnSymbols*' --tests '*OrderFlowUiTest.tabletCanOpenFourChartLayout*' --tests '*MobileLayoutTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tablet-toolbar-compose-previews
          path: |
            artifacts/unified-toolbar/*.png
            composeApp/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  tablet-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run actual Android tablet UI
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb shell wm size 1600x1000
            adb shell wm density 160
            ./gradlew :androidApp:connectedStandardDebugAndroidTest -PcredentialStoreTest=true -Pandroid.testInstrumentationRunnerArguments.class=com.unitrading.android.AppearanceUiTest#tabletUnifiedToolbarScreenshot --no-daemon
            mkdir -p artifacts/tablet-emulator
            adb pull /sdcard/Android/data/com.unitrading.demo.credentialtest/files/tablet-unified-toolbar.png artifacts/tablet-emulator/tablet-android.png
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: tablet-toolbar-android-screenshot
          path: |
            artifacts/tablet-emulator/*.png
            androidApp/build/reports/androidTests/connected/**
          if-no-files-found: warn
