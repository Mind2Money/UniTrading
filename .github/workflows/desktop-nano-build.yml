name: Side order panel and cross-platform regression
on:
  push:
    branches: ['build/upstream-window-sidebar-20261120']
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Verify detached-window interactions
        run: |
          set -o pipefail
          tests=( :composeApp:desktopTest
            --tests '*DesktopDetachedWorkspaceUiTest*'
            --tests '*ChartContextOrderPlatformsTest*'
            --tests '*WorkspaceAccountsTest*'
            --tests '*DesktopWorkspaceSessionStoreTest*'
            --tests '*DesktopWorkspaceTabsUiTest.windowsTitleTabsRespondToMouseAfterQuotesUpdate*'
            --tests '*DesktopWorkspaceTabsUiTest.restoredWindowsTitleUpdatesAllQuotesWithoutSelectingEachTab*'
            --tests '*WorkspaceTabDataTest*' )
          if ! xvfb-run -a ./gradlew "${tests[@]}" --no-daemon 2>&1 | tee "$RUNNER_TEMP/first-tests.log"; then
            if grep -Eq 'Could not resolve all artifacts|Could not find org\.jetbrains\.kotlin' "$RUNNER_TEMP/first-tests.log"; then
              xvfb-run -a ./gradlew "${tests[@]}" --no-daemon --refresh-dependencies
            else
              exit 1
            fi
          fi
      - name: Preserve detached-window test results
        run: |
          mkdir -p artifacts/detached-test-results
          cp composeApp/build/test-results/desktopTest/*.xml artifacts/detached-test-results/
      # Legacy ChartWindowsUiTest and DesktopWindowsUiTest target panel menus already removed in PR #4.
      # DesktopWorkspaceTabsUiTest and DesktopDetachedWorkspaceUiTest exercise the current tab/window UI.
      - name: Verify desktop, order safety, nano contracts and tablet regressions
        run: >-
          xvfb-run -a ./gradlew
          :composeApp:desktopTest
          --tests '*DesktopWorkspaceTabsUiTest*'
          --tests '*TabletWorkspaceTabsUiTest*'
          --tests '*WindowsTitleBarUiTest*'
          --tests '*DesktopAccountPanelsUiTest*'
          --tests '*ChartContextMenuUiTest*'
          --tests '*KeyboardTradingUiTest*'
          --tests '*OrderCapacityUiTest*'
          --tests '*OrderFlowUiTest*'
          --tests '*AccountBracketsUiTest*'
          --tests '*WorkspaceAccountsTest*'
          --tests '*ChartContextOrderPlatformsTest*'
          --tests '*TradeListUiTest*'
          --tests '*AccountRiskUiTest*'
          --tests '*MobileLayoutTest*'
          --tests '*MobileOrderPagesTest*'
          --tests '*ContinuousContractUiTest*'
          :tradovate-broker:desktopTest
          --tests '*ContinuousContractsTest*'
          --tests '*MarketWatchConcurrencyTest*'
          --tests '*TradovateDomTest*'
          :rithmic-broker:desktopTest
          --tests '*RithmicBrokerTest*'
          --continue --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: Desktop-Nano-Test-Results
          path: |
            artifacts/**
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
            rithmic-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Package Windows desktop application
        shell: pwsh
        run: |
          ./gradlew.bat :composeApp:createDistributable --no-daemon
          if ($LASTEXITCODE -ne 0) {
            Write-Host 'Retrying the build after refreshing dependencies.'
            ./gradlew.bat :composeApp:createDistributable --no-daemon --refresh-dependencies
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Verify and archive Windows application
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-Desktop-Nano-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-Desktop-Nano-Windows-x64
          path: dist/UniTrading-Desktop-Nano-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
      - name: Verify Windows title bar interactions
        shell: pwsh
        run: >-
          ./gradlew.bat :composeApp:desktopTest
          --tests '*WindowsTitleBarUiTest.titleBarRespondsToNativeMouse*'
          --tests '*DesktopWorkspaceTabsUiTest.windowsTitleTabsRespondToMouseAfterQuotesUpdate*'
          --tests '*DesktopWorkspaceTabsUiTest.restoredWindowsTitleUpdatesAllQuotesWithoutSelectingEachTab*'
          --no-daemon
  ios:
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build unsigned iOS device application
        run: |
          set -o pipefail
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp \
            -configuration Debug -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/UniTradingDevice" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO \
            COMPILER_INDEX_STORE_ENABLE=NO build 2>&1 | tee "$RUNNER_TEMP/ios-device-build.log"
      - name: Package unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="$RUNNER_TEMP/UniTradingDevice/Build/Products/Debug-iphoneos/UniTrading.app"
          test -x "$APP_PATH/UniTrading"
          mkdir -p "$RUNNER_TEMP/ipa/Payload" dist
          ditto "$APP_PATH" "$RUNNER_TEMP/ipa/Payload/UniTrading.app"
          (cd "$RUNNER_TEMP/ipa" && zip -qry "$GITHUB_WORKSPACE/dist/UniTrading-iOS-Unsigned-Debug.ipa" Payload)
          unzip -t dist/UniTrading-iOS-Unsigned-Debug.ipa | tail -1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-iOS-Unsigned-Debug
          path: dist/UniTrading-iOS-Unsigned-Debug.ipa
          if-no-files-found: error
          compression-level: 0
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Android debug APK
        run: ./gradlew :androidApp:assembleStandardDebug --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-Android-Debug
          path: androidApp/build/outputs/apk/standard/debug/*.apk
          if-no-files-found: error
