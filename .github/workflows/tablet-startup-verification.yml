name: Tablet Android startup verification
on:
  push:
    branches: [fix/tablet-toolbar-layout]
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Download the signed tablet test build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 44747697405 --repo "$GITHUB_REPOSITORY" --name tablet-toolbar-android --dir apk
          test -s apk/UniTrading-1.7.0-tablet-android-test.apk
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Launch the signed Android release build on a landscape tablet
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            set -e
            adb shell wm density 160
            adb shell wm size 1280x800
            adb install -r apk/UniTrading-1.7.0-tablet-android-test.apk
            adb logcat -c
            adb shell am start -n com.unitrading.demo/com.unitrading.android.MainActivity
            sleep 20
            adb shell pidof com.unitrading.demo
            adb shell dumpsys activity activities | grep -F 'com.unitrading.demo/com.unitrading.android.MainActivity'
            if adb logcat -b crash -d | grep -F 'Process: com.unitrading.demo'; then exit 1; fi
