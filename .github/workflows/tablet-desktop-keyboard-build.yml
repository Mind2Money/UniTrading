name: Tablet desktop workspace and landscape keyboard
on:
  push:
    branches: ['build/tablet-desktop-keyboard-20261119']
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Build Android (retry dependency resolution once)
        run: |
          ./gradlew :androidApp:assembleStandardDebug --no-daemon || \
            ./gradlew :androidApp:assembleStandardDebug --no-daemon --refresh-dependencies
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-TabletDesktop-Android-debug
          path: androidApp/build/outputs/apk/standard/debug/androidApp-standard-debug.apk
          if-no-files-found: error
  windows:
    runs-on: windows-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Package Windows app
        run: ./gradlew.bat :composeApp:createDistributable --no-daemon
      - name: Verify and archive Windows app
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $app = 'composeApp/build/compose/binaries/main/app/UniTrading'
          if (-not (Test-Path "$app/UniTrading.exe")) { throw 'Windows executable missing' }
          if (-not (Test-Path "$app/app/resources/tradovate-login/1.1.1/UniTrading.TradovateLogin.exe")) { throw 'Login host missing' }
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path $app -DestinationPath 'dist/UniTrading-TabletDesktop-Windows-x64.zip'
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: UniTrading-TabletDesktop-Windows-x64
          path: dist/UniTrading-TabletDesktop-Windows-x64.zip
          compression-level: 0
          if-no-files-found: error
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Install CJK fonts when available
        run: |
          if ! fc-list :lang=zh file | grep -q .; then
            mkdir -p ~/.local/share/fonts
            if timeout 120s curl -fsSL --retry 2 \
              https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
              -o ~/.local/share/fonts/NotoSansCJKsc-Regular.otf; then
              fc-cache -f ~/.local/share/fonts
            else
              echo "::warning::CJK font unavailable; continuing functional tests with runner fonts."
            fi
          fi
      - name: Test account toolbar, order safety and mobile regressions
        run: xvfb-run -a ./gradlew :composeApp:desktopTest --tests '*DesktopWorkspaceTabsUiTest*' --tests '*TabletWorkspaceTabsUiTest*' --tests '*WindowsTitleBarUiTest*' --tests '*ChartContextMenuUiTest*' --tests '*KeyboardTradingUiTest*' --tests '*AccountBracketsUiTest*' --tests '*OrderCapacityUiTest*' --tests '*ContinuousContractUiTest*' --tests '*DesktopAccountPanelsUiTest*' --tests '*AccountAliasUiTest*' --tests '*AccountOverviewUiTest*' --tests '*DesktopWindowsUiTest.aPlatformWithoutWindowsOffersNoneAndKeepsEveryPanelInPlace*' --tests '*MobileLayoutTest*' --tests '*MobileOrderPagesTest*' --tests '*MobileOrderDockTest*' --tests '*MobileSheetMotionTest*' --tests '*UnifiedToolbarUiTest*' --tests '*ChartDrawingsTest*' --tests '*DesktopPanelGeometryTest*' --tests '*ChartPreferencesTest*' --tests '*WorkspaceTabDataTest*' --tests '*ChartUndoCoordinatorTest*' --tests '*IndicatorSettingsTest*' --tests '*AccountAnalyticsTest*' --tests '*AccountAnalyticsUiTest*' --tests '*ResponsiveCalendarUiTest*' --tests '*SettingsPageTest*' --tests '*PriceAxisUiTest*' --tests '*ChartControlLayoutUiTest*' --tests '*OrderFlowUiTest*' --tests '*TradeListUiTest*' --tests '*AccountRiskUiTest*' --no-daemon
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UniTrading-TabletDesktop-Test-Results
          path: |
            artifacts/desktop-order/*.png
            artifacts/unified-toolbar/*.png
            artifacts/desktop-account-panels/*.png
            artifacts/desktop-tabs/*.png
            artifacts/multichart/*.png
            artifacts/orderflow/*.png
            artifacts/*.png
            composeApp/build/test-results/desktopTest/*.xml
            tradovate-broker/build/test-results/desktopTest/*.xml
          if-no-files-found: warn
  landscape-ime-emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - run: sdkmanager --install 'platforms;android-37.0' 'platforms;android-37.2'
      - uses: gradle/actions/setup-gradle@0b6dd653ba04f4f93bf581ec31e66cbd7dcb644d
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise the system keyboard on landscape tablet and phone
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          cores: 2
          ram-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-audio -no-boot-anim -camera-back none
          script: |
            adb shell settings put secure show_ime_with_hard_keyboard 1
            adb shell wm density 160
            adb shell wm size 1280x800
            mkdir -p artifacts/tablet-ime/tablet-results artifacts/tablet-ime/phone-results
            ./gradlew :androidApp:connectedStandardDebugAndroidTest -PcredentialStoreTest=true -Pandroid.testInstrumentationRunnerArguments.class=com.unitrading.android.AppearanceUiTest#landscapeTabletKeepsDesktopEditorWhenKeyboardOpens --no-daemon || touch /tmp/unitrading-tablet-ime-failed
            cp -R androidApp/build/outputs/androidTest-results/connected/. artifacts/tablet-ime/tablet-results/ || true
            adb pull /sdcard/Download/tablet-desktop-keyboard.png artifacts/tablet-ime/tablet-desktop-keyboard.png || true
            adb pull /sdcard/Download/landscape-ime-failure.png artifacts/tablet-ime/tablet-ime-failure.png || true
            adb shell rm -f /sdcard/Download/landscape-ime-failure.png
            adb shell wm size 960x540
            ./gradlew :androidApp:connectedStandardDebugAndroidTest -PcredentialStoreTest=true -Pandroid.testInstrumentationRunnerArguments.class=com.unitrading.android.AppearanceUiTest#landscapePhoneKeepsOrderSheetWhenKeyboardOpens --no-daemon || touch /tmp/unitrading-phone-ime-failed
            cp -R androidApp/build/outputs/androidTest-results/connected/. artifacts/tablet-ime/phone-results/ || true
            adb pull /sdcard/Download/landscape-ime-failure.png artifacts/tablet-ime/phone-ime-failure.png || true
            test ! -e /tmp/unitrading-tablet-ime-failed && test ! -e /tmp/unitrading-phone-ime-failed
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: UniTrading-TabletDesktop-Android-IME-Tests
          path: |
            artifacts/tablet-ime/**
            androidApp/build/reports/androidTests/connected/**
            androidApp/build/outputs/androidTest-results/connected/**
          if-no-files-found: warn
